[project]
name = "system-monitor"
version = "0.1.0"
description = "Cross-platform standalone Performance Monitor with a native window."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "system-monitor contributors" }]
dependencies = [
    "Flask>=3.0.0",
    "psutil>=5.9.0",
    "pywebview>=5.0",
    # Linux: ship a Qt backend via wheels so users don't need GTK system packages.
    'PyQt6>=6.5; sys_platform == "linux"',
    'PyQt6-WebEngine>=6.5; sys_platform == "linux"',
    'QtPy>=2.4; sys_platform == "linux"',
]

[project.scripts]
system-monitor = "system_monitor.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["system_monitor"]

[tool.hatch.build.targets.wheel.force-include]
"system_monitor/static" = "system_monitor/static"

[tool.hatch.build.targets.sdist]
include = ["system_monitor", "README.md", "pyproject.toml"]
